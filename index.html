<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Správa badmintonových turnajů – losování, výsledky, statistiky">
    <meta name="theme-color" content="#1e5a46">
    <title>Správa turnajů</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231e5a46'/><path d='M10.5 5h11L18.6 18h-5.2z' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/><circle cx='16' cy='23' r='4' fill='%23e8cf1f'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Skip to main content (accessibility) -->
    <a href="#app-content" class="skip-link">Přeskočit na obsah</a>

    <div class="container">
        <header class="header" role="banner">
            <a class="brand" href="./" aria-label="Na úvod">
                <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9.5 3.5h13L19 19h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.5 15 19M18 3.5 17 19M10.7 9h10.6M11.9 14.5h8.2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="16" cy="24" r="4.6" fill="currentColor"/></svg>
            </a>
            <div class="header-left">
                <h1 id="tournament-title">Správa turnajů</h1>
                <p id="tournament-subtitle" aria-live="polite">Správa turnajů</p>
            </div>
            <nav class="header-right" aria-label="Nástroje">
                <button class="icon-btn" onclick="undoAction()" title="Zpět (Ctrl+Z)" id="undo-btn" aria-label="Vrátit zpět">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
                </button>
                <button class="icon-btn" onclick="redoAction()" title="Vpřed (Ctrl+Y)" id="redo-btn" aria-label="Zopakovat">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
                </button>
                <span class="header-sep" aria-hidden="true"></span>
                <button class="icon-btn" onclick="Print.menu()" title="Tisk: lístky, rozpis, čísla kurtů" aria-label="Tisk">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4.5A1.5 1.5 0 0 1 3 16.5v-6A1.5 1.5 0 0 1 4.5 9h15a1.5 1.5 0 0 1 1.5 1.5v6a1.5 1.5 0 0 1-1.5 1.5H18"/><path d="M6 14h12v7H6z"/></svg>
                </button>
                <button class="icon-btn" onclick="openExportMenu()" title="Export a sdílení výsledků" aria-label="Export">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                </button>
                <details class="more-menu">
                    <summary class="icon-btn" title="Další nástroje" aria-label="Další nástroje">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
                    </summary>
                    <div class="more-panel" role="menu" onclick="if(event.target.closest('button')) this.parentElement.removeAttribute('open')">
                        <button role="menuitem" onclick="showTemplatesModal()">Šablony turnajů</button>
                        <button role="menuitem" onclick="openHistory()">Historie turnajů</button>
                        <button role="menuitem" onclick="Stats.showHistoricalStats()">Statistiky hráčů</button>
                        <button role="menuitem" onclick="State.showBackupMenu()">Záloha dat</button>
                        <hr>
                        <button role="menuitem" onclick="openThemeMenu()">Barva kurtu</button>
                        <button role="menuitem" onclick="toggleDarkMode()">Světlý / tmavý režim</button>
                        <button role="menuitem" onclick="i18n.showLanguageSelector()">Jazyk / Language</button>
                    </div>
                </details>
                <button class="btn btn-live" onclick="openSpectatorMode()" title="Sdílet živé výsledky divákům a na monitor">
                    <span class="live-dot" aria-hidden="true"></span>Živě
                </button>
            </nav>
        </header>

        <nav class="steps" id="steps-container" aria-label="Kroky turnaje"></nav>
        <main id="app-content" role="main" aria-live="polite"></main>
    </div>

    <!-- Modals -->
    <div id="participant-modal" class="modal" role="dialog" aria-modal="true"></div>
    <div id="theme-modal" class="modal" role="dialog" aria-modal="true"></div>
    <div id="history-modal" class="modal" role="dialog" aria-modal="true"></div>
    <div id="export-modal" class="modal" role="dialog" aria-modal="true"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="./js/firebase.js"></script>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/ui.js"></script>
    <script src="./js/matches.js"></script>
    <script src="./js/swiss.js"></script>
    <script src="./js/playoff.js"></script>
    <script src="./js/stats.js"></script>
    <script src="./js/export.js"></script>
    <script src="./js/courts.js"></script>
    <script src="./js/remote.js"></script>
    <script src="./js/print.js"></script>
    <script src="./js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        // Check for updates
                        reg.addEventListener('updatefound', () => {
                            const newWorker = reg.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    // New version available
                                    if (typeof Utils !== 'undefined') {
                                        Utils.showNotification('🔄 Dostupná nová verze. Obnovte stránku.', 'info');
                                    }
                                }
                            });
                        });
                    })
                    .catch(err => console.warn('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
